<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef1f6; margin: 0;
               min-height: 100vh; display: flex; align-items: center;
               justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 12px; padding: 35px 40px;
                width: 100%; max-width: 420px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08); }
        h1 { margin: 0 0 6px; font-size: 24px; color: #1f2937; }
        .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        form p { margin: 0 0 14px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; }
        input { width: 100%; padding: 10px 12px; font-size: 14px;
                border: 1px solid #d1d5db; border-radius: 8px;
                box-sizing: border-box; }
        input:focus { outline: none; border-color: #667eea;
                      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15); }
        .helptext { font-size: 12px; color: #9ca3af; display: block; margin-top: 4px; }
        .errorlist { color: #dc2626; font-size: 12px; margin: 4px 0 0;
                     padding-left: 16px; }
        .btn { width: 100%; padding: 11px; border: none; border-radius: 8px;
               background: #667eea; color: #fff; font-size: 15px;
               cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #5568d3; }
        .footer { text-align: center; font-size: 14px; color: #6b7280;
                  margin-top: 20px; }
        .footer a { color: #667eea; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Регистрация</h1>
        <div class="subtitle">Создайте аккаунт, чтобы бронировать номера</div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>

        <div class="footer">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </div>
    </div>
</body>
</html>
