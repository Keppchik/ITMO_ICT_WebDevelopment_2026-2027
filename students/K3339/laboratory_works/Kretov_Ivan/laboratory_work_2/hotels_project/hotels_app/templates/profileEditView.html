<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование профиля</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #eef1f6;
            margin: 0;
            padding: 40px 20px;
        }

        .card {
            max-width: 640px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: 30px 36px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 5px;
            font-size: 22px;
            color: #1f2937;
        }

        .subtitle {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .field { margin-bottom: 14px; }

        .field label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .errorlist {
            color: #dc2626;
            font-size: 12px;
            margin: 4px 0 0;
            padding-left: 16px;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-save { background: #667eea; color: #fff; }
        .btn-save:hover { background: #5568d3; }

        .btn-cancel { background: #eee; color: #333; }
        .btn-cancel:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Редактирование профиля</h1>
        <div class="subtitle">Измените нужные поля и сохраните</div>

        <form method="post" novalidate>
            {% csrf_token %}

            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <ul class="errorlist">
                            {% for error in field.errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="actions">
                <button type="submit" class="btn btn-save">Сохранить</button>
                <a href="{% url 'profile' %}" class="btn btn-cancel">Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
