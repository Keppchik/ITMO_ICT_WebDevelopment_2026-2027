<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ car.brand }} {{ car.model }}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 30px; }
        .card {
            max-width: 600px; margin: 0 auto; background: #fff;
            border-radius: 8px; padding: 25px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 { margin: 0 0 5px; font-size: 22px; color: #333; }
        .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
        .row span:first-child { color: #777; }
        .row span:last-child { color: #222; font-weight: bold; }
        .actions { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; }
        .btn-edit { background: #667eea; color: #fff; }
        .btn-delete { background: #d32f2f; color: #fff; }
        .btn-back { background: #eee; color: #333; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ car.brand }} {{ car.model }}</h1>
        <div class="subtitle">Автомобиль #{{ car.pk }}</div>

        <div class="row"><span>Гос. номер</span><span>{{ car.gos_number }}</span></div>
        <div class="row"><span>Марка</span><span>{{ car.brand }}</span></div>
        <div class="row"><span>Модель</span><span>{{ car.model }}</span></div>
        <div class="row"><span>Цвет</span><span>{{ car.color }}</span></div>

        <div class="actions">
            <a class="btn btn-edit" href="{% url 'car_update' car.pk %}">Редактировать</a>
            <a class="btn btn-delete" href="{% url 'car_delete' car.pk %}">Удалить</a>
            <a class="btn btn-back" href="{% url 'car_list' %}">← К списку</a>
        </div>
    </div>
</body>
</html>
