<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый автомобиль</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 30px; }
        .card {
            max-width: 600px; margin: 0 auto; background: #fff;
            border-radius: 8px; padding: 25px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 { margin: 0 0 20px; font-size: 22px; color: #333; }
        form p { margin: 0 0 14px; }
        label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
        input[type="text"] {
            width: 100%; padding: 8px 10px; font-size: 14px;
            border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #667eea; }
        .errorlist { color: #d32f2f; font-size: 12px; margin: 4px 0 0; padding-left: 16px; }
        .actions { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; text-decoration: none; }
        .btn-save { background: #667eea; color: #fff; }
        .btn-back { background: #eee; color: #333; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Новый автомобиль</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit" class="btn btn-save">Создать</button>
                <a class="btn btn-back" href="{% url 'car_list' %}">Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
